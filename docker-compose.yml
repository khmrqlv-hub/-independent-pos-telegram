services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-pos-password}
      POSTGRES_DB: pos
      TZ: Asia/Tashkent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pos_postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  pos_postgres_data:

