name: PostgreSQL core gate

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: postgresql-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: pos_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: pos
          TZ: Asia/Tashkent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos_ci -d pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PRIMARY_DATABASE_URL: postgresql://pos_ci:ci-only-password@127.0.0.1:5432/pos
      TEST_DATABASE_URL: postgresql://pos_ci:ci-only-password@127.0.0.1:5432/pos_test
      RESTORE_TEST_DATABASE_URL: postgresql://pos_ci:ci-only-password@127.0.0.1:5432/pos_restore_test
      PG_DUMP_BIN: pg_dump
      PG_RESTORE_BIN: pg_restore

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Create isolated test databases
        env:
          PGPASSWORD: ci-only-password
        run: |
          createdb --host=127.0.0.1 --username=pos_ci pos_test
          createdb --host=127.0.0.1 --username=pos_ci pos_restore_test
      - name: Typecheck, unit tests, build
        run: npm run check
      - name: PostgreSQL integration, concurrency and restore
        run: npm run test:integration
      - name: Upload failed-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-test-artifacts
          path: .test-artifacts/
          if-no-files-found: ignore
          retention-days: 3
